<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1210">
  <title>QRs por mesa — Santa Elena Café | Bar</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="qr-page">
    <h1>
      <svg class="ico ico--title" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M13.5 13.5h3.2v3.2h-3.2z"/><path d="M20.5 13.5v3.2M17.5 20.5h3M13.5 20.5h.01"/>
      </svg>
      Códigos QR por mesa
    </h1>
    <p class="lead">
      Imprime estos códigos y colócalos en cada mesa. Al escanearlos, el cliente entra
      directo al apartado <strong>Bebidas con licor</strong> de su mesa (ej: <code>/2/bebidasalcohol</code>).
    </p>

    <div class="qr-page__actions">
      <button id="btn-print">
        <svg class="ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.5 9.5V3.5h11v6"/><rect x="3" y="9.5" width="18" height="7.5" rx="2"/><rect x="6.5" y="14" width="11" height="6.5" rx="1.5"/>
        </svg>
        Imprimir / Guardar PDF
      </button>
      <button id="btn-reload">
        <svg class="ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5V9H15"/>
        </svg>
        Regenerar
      </button>
    </div>

    <div class="qr-grid" id="grid"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      var MESAS = 20;
      var grid = document.getElementById("grid");

      function generar() {
        grid.innerHTML = "";
        if (typeof QRCode === "undefined") {
          grid.innerHTML = '<p style="color:var(--danger);grid-column:1/-1;">No se pudo cargar la librería de QR (necesitas conexión a internet). Recarga la página.</p>';
          return;
        }
        for (var i = 1; i <= MESAS; i++) {
          var href = new URL("../" + i + "/bebidasalcohol/", document.baseURI).href;
          var card = document.createElement("div");
          card.className = "qr-card";
          card.innerHTML = '<h3>Mesa ' + i + "</h3>";
          var qrDiv = document.createElement("div");
          card.appendChild(qrDiv);
          var urlEl = document.createElement("div");
          urlEl.className = "url";
          urlEl.textContent = href.replace(/^https?:\/\//, "");
          card.appendChild(urlEl);
          grid.appendChild(card);
          new QRCode(qrDiv, {
            text: href,
            width: 120,
            height: 120,
            colorDark: "#1a1210",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
          });
        }
      }

      document.getElementById("btn-print").addEventListener("click", function () { window.print(); });
      document.getElementById("btn-reload").addEventListener("click", generar);
      generar();
    })();
  </script>
</body>
</html>
