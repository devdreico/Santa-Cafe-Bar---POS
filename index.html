<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1210">
  <title>Santa Elena Café | Bar — Elige tu mesa</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="root">
    <div class="root__hero">
      <img src="assets/santa-cafe-bar-logo.png" alt="Santa Elena Café | Bar">
      <h1>Santa Elena Café | Bar</h1>
      <p>Menú digital y pedidos desde tu mesa.<br>¡Bienvenido!</p>
    </div>

    <div class="root__label">¿En qué mesa te encuentras?</div>
    <div class="root__grid" id="mesas"></div>

    <div class="root__foot">
      <svg class="ico ico--foot" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M12 16.5V11.5"/><path d="M12 7.6h.01"/>
      </svg>
      Si estás en tu mesa, escanea el <strong>QR</strong> y entrarás directo al menú de bebidas.
    </div>
  </div>

  <script>
    (function () {
      var MESAS = 20;
      var grid = document.getElementById("mesas");
      var html = "";
      for (var i = 1; i <= MESAS; i++) {
        html += '<a href="' + i + '/">Mesa ' + i + "<small>Entrar</small></a>";
      }
      grid.innerHTML = html;
    })();
  </script>
</body>
</html>
